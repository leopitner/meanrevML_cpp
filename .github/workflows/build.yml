name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Run demo
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/meanrevML_demo.exe
          else
            ./build/meanrevML_demo
          fi
        shell: bash
        continue-on-error: true